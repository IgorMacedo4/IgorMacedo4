name: Render profile assets

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Só o código do gerador dispara. Sem esse filtro o commit dos próprios
    # assets religaria o workflow em loop.
    paths:
      - 'src/**'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletar dados do perfil
        env:
          # METRICS_TOKEN é opcional: sem ele o GITHUB_TOKEN cobre os dados
          # públicos. Com um PAT, os repositórios privados entram na contagem.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node src/fetch.mjs

      - name: Gerar SVGs
        run: node src/build.mjs

      - name: Commitar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets src/data.json
          if git diff --staged --quiet; then
            echo "nada mudou"
          else
            git commit -m "Atualiza assets do perfil [skip ci]"
            git push
          fi
