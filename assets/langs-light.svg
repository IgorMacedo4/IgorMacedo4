          fill="#f1e05a" style="animation-delay:0.07s"/>
    <text x="408" y="95" class="pct" fill="#656D76">13%</text>
    <circle cx="27" cy="114" r="4.5" fill="#00B4AB"/>
    <text x="39" y="118" class="lbl" fill="#1F2328">Dart</text>
    <rect x="128" y="109" width="238" height="7" rx="3.5" fill="#E7EBEF"/>
    <rect class="bar" x="128" y="109" width="55" height="7" rx="3.5"
          fill="#00B4AB" style="animation-delay:0.14s"/>
    <text x="408" y="118" class="pct" fill="#656D76">13%</text>
    <circle cx="27" cy="137" r="4.5" fill="#f34b7d"/>
    <text x="39" y="141" class="lbl" fill="#1F2328">C++</text>
    <rect x="128" y="132" width="238" height="7" rx="3.5" fill="#E7EBEF"/>
    <rect class="bar" x="128" y="132" width="18" height="7" rx="3.5"
          fill="#f34b7d" style="animation-delay:0.21s"/>
    <text x="408" y="141" class="pct" fill="#656D76">4%</text>
    <circle cx="27" cy="160" r="4.5" fill="#e34c26"/>
    <text x="39" y="164" class="lbl" fill="#1F2328">HTML</text>
    <rect x="128" y="155" width="238" height="7" rx="3.5" fill="#E7EBEF"/>
