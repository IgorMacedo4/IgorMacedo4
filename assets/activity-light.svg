<svg xmlns="http://www.w3.org/2000/svg" width="430" height="232" viewBox="0 0 430 232" role="img" aria-label="Atividade no GitHub">
<title>Atividade no GitHub</title>
<style><![CDATA[
.h{font:700 12px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:2.2px}
.big{font:700 27px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:-.5px}
.cap{font:400 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.4px}
.lbl{font:500 12px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.pct{font:400 11px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;text-anchor:end}
.yr{font:400 9.5px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;text-anchor:middle}
.note{font:400 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;text-anchor:middle}

/* As barras nascem completas. A animacao so encolhe o inicio e devolve ao
   tamanho natural, entao sem CSS elas continuam corretas. */
.bar{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.col{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:scaleY(0)}}
]]></style>

  
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EFF2F5"/>
    </pattern>
  </defs>
  <rect width="430" height="232" rx="12" fill="#FFFFFF"/>
  <rect width="430" height="232" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="429" height="231" rx="12" fill="none" stroke="#D8DEE4"/>
  
  <rect x="22" y="24" width="3" height="15" rx="1.5" fill="#0969DA"/>
  <text x="34" y="36" class="h" fill="#1F2328">ATIVIDADE</text>
  <line x1="22" y1="52" x2="408" y2="52" stroke="#E7EBEF"/>
  
    <text x="86.33333333333333" y="88" class="big" fill="#1F2328" text-anchor="middle">655</text>
    <text x="86.33333333333333" y="105" class="cap" fill="#656D76" text-anchor="middle">commits no ano</text>
    <text x="215" y="88" class="big" fill="#1F2328" text-anchor="middle">59</text>
    <text x="215" y="105" class="cap" fill="#656D76" text-anchor="middle">repositórios</text>
    <text x="343.66666666666663" y="88" class="big" fill="#1F2328" text-anchor="middle">28</text>
    <text x="343.66666666666663" y="105" class="cap" fill="#656D76" text-anchor="middle">públicos</text>
  
    <rect class="col" x="43.6" y="156" width="34" height="18" rx="3"
          fill="#0969DA" fill-opacity="0.32"
          style="animation-delay:0.00s"/>
    <text x="60.6" y="189" class="yr" fill="#656D76">2022</text>
    <rect class="col" x="120.80000000000001" y="153" width="34" height="21" rx="3"
          fill="#0969DA" fill-opacity="0.32"
          style="animation-delay:0.07s"/>
    <text x="137.8" y="189" class="yr" fill="#656D76">2023</text>
    <rect class="col" x="198" y="160" width="34" height="14" rx="3"
          fill="#0969DA" fill-opacity="0.32"
          style="animation-delay:0.14s"/>
    <text x="215" y="189" class="yr" fill="#656D76">2024</text>
    <rect class="col" x="275.20000000000005" y="137" width="34" height="37" rx="3"
          fill="#0969DA" fill-opacity="0.32"
          style="animation-delay:0.21s"/>
    <text x="292.20000000000005" y="189" class="yr" fill="#656D76">2025</text>
    <rect class="col" x="352.40000000000003" y="128" width="34" height="46" rx="3"
          fill="#0969DA" fill-opacity="1"
          style="animation-delay:0.28s"/>
    <text x="369.40000000000003" y="189" class="yr" fill="#656D76">2026</text>
  <text x="215" y="218" class="note" fill="#656D76">repositórios com push por ano</text>
</svg>
