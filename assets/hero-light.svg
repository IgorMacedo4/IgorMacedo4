<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-label="Igor Macedo — pipeline">
<title>Igor Macedo — pipeline</title>
<style><![CDATA[
.title{font:700 30px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:4px}
.role{font:400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.3px}
.livet{font:500 12px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:1px}
.foot{font:400 12.5px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.6px;text-anchor:middle}
.nlabel{font:700 15px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:1.6px;text-anchor:middle}
.nsub{font:400 11px ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;text-anchor:middle}

/* Pacotes comecam invisiveis: sao decorativos. Sem animacao, o pipeline
   continua legivel — so fica parado. */
.pkt{opacity:0;animation:none 2.1s linear infinite}
@keyframes seg0{
  0%{transform:translate(190px,208px);opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{transform:translate(249px,208px);opacity:0}
}
@keyframes seg1{
  0%{transform:translate(407px,208px);opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{transform:translate(467px,208px);opacity:0}
}
@keyframes seg2{
  0%{transform:translate(625px,208px);opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{transform:translate(684px,208px);opacity:0}
}

.dash{animation:drift 1.1s linear infinite}
@keyframes drift{to{stroke-dashoffset:-10}}

.glow{opacity:0;animation:breathe 2.1s ease-in-out infinite}
.n0 .glow{animation-delay:0s}
.n1 .glow{animation-delay:.5s}
.n2 .glow{animation-delay:1s}
.n3 .glow{animation-delay:1.5s}
@keyframes breathe{0%,100%{opacity:0}45%{opacity:0.13}}

.live circle{animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
]]></style>

  
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EFF2F5"/>
    </pattern>
  </defs>
  <rect width="880" height="310" rx="12" fill="#FFFFFF"/>
  <rect width="880" height="310" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="879" height="309" rx="12" fill="none" stroke="#D8DEE4"/>
  <g>
    <rect x="46" y="46" width="4" height="22" rx="2" fill="#0969DA"/>
    <text x="62" y="65" class="title" fill="#1F2328">IGOR MACEDO</text>
    <text x="62" y="92" class="role" fill="#656D76">Full Stack Developer &#183; AI &amp; ML Engineer &#183; Web Scraping</text>
    <line x1="46" y1="116" x2="834" y2="116" stroke="#E7EBEF"/>
    <g class="live">
      <circle cx="762" cy="57" r="4" fill="#1A7F37"/>
      <text x="774" y="62" class="livet" fill="#656D76">shipping</text>
    </g>
  </g>
  <g class="pipe">
    
  <g class="link">
    <line x1="190" y1="208" x2="249" y2="208" stroke="#D8DEE4" stroke-width="2"/>
    <line class="dash" x1="190" y1="208" x2="249" y2="208" stroke="#0969DA" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="4 6"/>
    <path d="M249 203 L256 208 L249 213 Z" fill="#0969DA" fill-opacity="0.8"/>
    <circle class="pkt" r="3.5" fill="#0969DA" style="animation-name:seg0;animation-delay:0.00s"/><circle class="pkt" r="3.5" fill="#0969DA" style="animation-name:seg0;animation-delay:0.70s"/><circle class="pkt" r="3.5" fill="#0969DA" style="animation-name:seg0;animation-delay:1.40s"/>
  </g>
  <g class="link">
    <line x1="407" y1="208" x2="467" y2="208" stroke="#D8DEE4" stroke-width="2"/>
    <line class="dash" x1="407" y1="208" x2="467" y2="208" stroke="#8250DF" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="4 6"/>
    <path d="M467 203 L474 208 L467 213 Z" fill="#8250DF" fill-opacity="0.8"/>
    <circle class="pkt" r="3.5" fill="#8250DF" style="animation-name:seg1;animation-delay:0.22s"/><circle class="pkt" r="3.5" fill="#8250DF" style="animation-name:seg1;animation-delay:0.92s"/><circle class="pkt" r="3.5" fill="#8250DF" style="animation-name:seg1;animation-delay:1.62s"/>
  </g>
  <g class="link">
    <line x1="625" y1="208" x2="684" y2="208" stroke="#D8DEE4" stroke-width="2"/>
    <line class="dash" x1="625" y1="208" x2="684" y2="208" stroke="#1A7F37" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="4 6"/>
    <path d="M684 203 L691 208 L684 213 Z" fill="#1A7F37" fill-opacity="0.8"/>
    <circle class="pkt" r="3.5" fill="#1A7F37" style="animation-name:seg2;animation-delay:0.44s"/><circle class="pkt" r="3.5" fill="#1A7F37" style="animation-name:seg2;animation-delay:1.14s"/><circle class="pkt" r="3.5" fill="#1A7F37" style="animation-name:seg2;animation-delay:1.84s"/>
  </g>
    
  <g class="node n0">
    <rect class="glow" x="43" y="167" width="142" height="82" rx="11" fill="none" stroke="#656D76" stroke-width="2"/>
    <rect x="46" y="170" width="136" height="76" rx="9" fill="#F6F8FA" stroke="#656D76" stroke-opacity="0.55"/>
    <rect x="46" y="170" width="136" height="3" rx="1.5" fill="#656D76"/>
    <text x="114" y="203" class="nlabel" fill="#1F2328">TRIBUNAIS</text>
    <text x="114" y="224" class="nsub" fill="#656D76">fontes públicas</text>
  </g>
  <g class="node n1">
    <rect class="glow" x="260" y="167" width="142" height="82" rx="11" fill="none" stroke="#0969DA" stroke-width="2"/>
    <rect x="263" y="170" width="136" height="76" rx="9" fill="#F6F8FA" stroke="#0969DA" stroke-opacity="0.55"/>
    <rect x="263" y="170" width="136" height="3" rx="1.5" fill="#0969DA"/>
    <text x="331" y="203" class="nlabel" fill="#1F2328">SCRAPER</text>
    <text x="331" y="224" class="nsub" fill="#656D76">python · lambda</text>
  </g>
  <g class="node n2">
    <rect class="glow" x="478" y="167" width="142" height="82" rx="11" fill="none" stroke="#8250DF" stroke-width="2"/>
    <rect x="481" y="170" width="136" height="76" rx="9" fill="#F6F8FA" stroke="#8250DF" stroke-opacity="0.55"/>
    <rect x="481" y="170" width="136" height="3" rx="1.5" fill="#8250DF"/>
    <text x="549" y="203" class="nlabel" fill="#1F2328">LLM</text>
    <text x="549" y="224" class="nsub" fill="#656D76">extrai prazos</text>
  </g>
  <g class="node n3">
    <rect class="glow" x="695" y="167" width="142" height="82" rx="11" fill="none" stroke="#1A7F37" stroke-width="2"/>
    <rect x="698" y="170" width="136" height="76" rx="9" fill="#F6F8FA" stroke="#1A7F37" stroke-opacity="0.55"/>
    <rect x="698" y="170" width="136" height="3" rx="1.5" fill="#1A7F37"/>
    <text x="766" y="203" class="nlabel" fill="#1F2328">DADOS</text>
    <text x="766" y="224" class="nsub" fill="#656D76">{ prazo, parte }</text>
  </g>
  </g>
  <text x="440" y="276" class="foot" fill="#656D76">656 commits   ·   28 repositórios   ·   661 contribuições em 2026</text>
</svg>
